name: Frontend Deploy to AWS S3 + CloudFront

on:
  push:
    branches: ["main"]
    paths: ["omnilaze-frontend/**"]
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  S3_BUCKET: omnilaze-frontend
  NODE_VERSION: '20'

jobs:
  deploy:
    name: 部署前端到AWS
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🏗️ 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: omnilaze-frontend/package-lock.json

      - name: 🔑 配置AWS凭证
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 📦 安装依赖
        working-directory: omnilaze-frontend
        run: npm ci

      - name: 🔨 构建前端
        working-directory: omnilaze-frontend
        run: npm run build:aws
        env:
          REACT_APP_API_URL: https://backend.omnilaze.co
          REACT_APP_AMAP_KEY: ${{ secrets.REACT_APP_AMAP_KEY }}

      - name: 📤 部署到S3
        working-directory: omnilaze-frontend
        run: |
          # 上传静态资源（长缓存）
          aws s3 sync dist/ s3://$S3_BUCKET/ \
            --delete \
            --cache-control "public, max-age=31536000" \
            --exclude "*.html" \
            --exclude "*.json"
          
          # 上传HTML文件（短缓存）
          aws s3 sync dist/ s3://$S3_BUCKET/ \
            --cache-control "public, max-age=0, must-revalidate" \
            --include "*.html" \
            --include "*.json"

      - name: 🌍 清除CloudFront缓存
        id: invalidate
        run: |
          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Origins.Items[0].DomainName=='$S3_BUCKET.s3-website-$AWS_REGION.amazonaws.com'].Id" \
            --output text)
          
          if [ -n "$DISTRIBUTION_ID" ] && [ "$DISTRIBUTION_ID" != "None" ]; then
            echo "distribution-id=$DISTRIBUTION_ID" >> $GITHUB_OUTPUT
            aws cloudfront create-invalidation \
              --distribution-id $DISTRIBUTION_ID \
              --paths "/*"
          fi

      - name: 📋 部署摘要
        run: |
          echo "## 🎉 前端部署完成" >> $GITHUB_STEP_SUMMARY
          echo "- **构建**: React Native Web (Expo)" >> $GITHUB_STEP_SUMMARY
          echo "- **后端API**: https://backend.omnilaze.co" >> $GITHUB_STEP_SUMMARY
          echo "- **S3存储桶**: $S3_BUCKET" >> $GITHUB_STEP_SUMMARY
          echo "- **AWS区域**: $AWS_REGION" >> $GITHUB_STEP_SUMMARY
          
          if [ -n "${{ steps.invalidate.outputs.distribution-id }}" ]; then
            DOMAIN_NAME=$(aws cloudfront get-distribution \
              --id ${{ steps.invalidate.outputs.distribution-id }} \
              --query 'Distribution.DomainName' \
              --output text)
            echo "- **CloudFront URL**: https://$DOMAIN_NAME" >> $GITHUB_STEP_SUMMARY
            echo "- **缓存清理**: 已触发" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **S3网站URL**: http://$S3_BUCKET.s3-website-$AWS_REGION.amazonaws.com" >> $GITHUB_STEP_SUMMARY
          fi